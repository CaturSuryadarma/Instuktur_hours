<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Laporan Kalkulasi jam pelatihan instruktur">
<title>Instructor Training Hours</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;line-height:1.5}button{font:inherit}svg{flex-shrink:0}.notice{display:block}
*{box-sizing:border-box}body{margin:0}.portal{min-height:100vh;background:#f1f5f8;color:#102e43}.topbar{height:88px;background:#102e43;border-bottom:3px solid #27b4b6;padding:0 3.5%;display:flex;align-items:center;justify-content:space-between;color:white}.brand{display:flex;align-items:center;gap:13px;font-size:18px;font-weight:650;letter-spacing:.12em}.brand span:not(.brand-icon){display:block;font-size:11px;font-weight:400;letter-spacing:.18em;margin-top:2px;color:#b9cbd7}.brand-icon{display:grid;place-items:center;background:#1c4559;border:1px solid #3a6274;width:44px;height:44px;border-radius:10px;color:#6de0dc}.top-label{font-size:12px;letter-spacing:.16em;color:#b9cbd7}main{max-width:1800px;margin:auto;padding:34px 3.5% 20px}.heading-row{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:26px}.eyebrow{font-size:12px;font-weight:650;letter-spacing:.17em;color:#007a83;margin:0 0 8px}h1{font-size:clamp(25px,2.5vw,38px);line-height:1.2;font-weight:600;letter-spacing:-.04em;margin:0}h1>span{color:#009a9e}.subtitle{font-size:15px;color:#5e7181;margin:9px 0 0}.external-link{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:6px;background:#007984;color:white;text-decoration:none;font-size:14px;font-weight:550;white-space:nowrap}.external-link:hover{background:#005e69}.report-shell{background:white;border:1px solid #d7e1e7;border-radius:10px;overflow:hidden;box-shadow:0 8px 25px #102e4308;scroll-margin-top:15px}.toolbar{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 20px;border-bottom:1px solid #e0e7ec}.report-label{display:flex;align-items:center;gap:10px;color:#007984}h2{font-size:14px;font-weight:600;color:#243d50;margin:0}.actions{display:flex;gap:8px}.actions button{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #d9e2e8;background:white;border-radius:5px;color:#3a5265;font-size:14px;cursor:pointer}.actions button:hover{background:#eef6f7;border-color:#83b7be}iframe{display:block;border:0;width:100%;height:clamp(430px,calc(100vh - 345px),1000px);background:#fafafa}.report-caption{border-top:1px solid #e0e7ec;min-height:45px;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;color:#657785}.powerbi{display:flex;align-items:center;gap:8px;white-space:nowrap}.powerbi i{width:7px;height:13px;background:#e2b92c;border-radius:2px}.notice{font-size:14px;color:#326675;margin:10px 0;min-height:0}.notice:empty{display:none}footer{display:flex;justify-content:space-between;gap:16px;color:#647786;font-size:12px;padding-top:23px}footer>span:first-child{letter-spacing:.1em;font-size:11px}footer a{display:inline-flex;align-items:center;gap:3px;color:#007984;text-decoration:none;margin-left:5px}.report-shell:fullscreen{display:flex;flex-direction:column;border:0;border-radius:0}.report-shell:fullscreen iframe{flex:1;height:auto}.skip-link{position:absolute;left:16px;top:-100px;background:white;padding:12px;z-index:10}.skip-link:focus{top:10px}:focus-visible{outline:3px solid #1aa9b0;outline-offset:4px}@media(max-width:640px){.topbar{height:74px;padding:0 20px}.top-label{display:none}main{padding:25px 14px 18px}.heading-row{align-items:flex-start;flex-direction:column;gap:17px;margin-bottom:20px}.external-link{padding:10px 13px}.toolbar{padding:12px;flex-wrap:wrap;gap:10px}.actions{margin-left:auto}.actions button{font-size:12px;padding:8px}.report-caption{align-items:flex-start;flex-direction:column;padding:12px;font-size:12px}iframe{height:65vh;min-height:420px}footer{flex-direction:column;gap:8px}.brand{font-size:16px}}@media(prefers-reduced-motion:no-preference){button,a{transition:background .15s}}
</style>
</head>
<body>
  <div class="portal">
   <a class="skip-link" href="#report">Langsung ke laporan</a>
   <header class="topbar">
    <div class="brand"><span class="brand-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18M8 16v-5m5 5V7m5 9v-8"/></svg></span><div>Instructor Training Hours<span>Laporan Kalkulasi Jam Pelatihan</span></div></div>
   </header>
   <main>
    <div class="heading-row">
     <a class="external-link" href="https://app.powerbi.com/view?r=eyJrIjoiYTU1ZGE2ZDUtOTIyZC00MzUxLTkwNjgtMmYwZWM4MTgxOGU1IiwidCI6IjNhZDZiNTQ2LTdjMGQtNGVkNS05YTFkLWE1YmFjOTZlN2M3YSIsImMiOjEwfQ%3D%3D" target="_blank" rel="noopener noreferrer">Buka Power BI <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
    </div>
    <div class="report-shell" id="report">
     <div class="toolbar"><div class="report-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18M8 16v-5m5 5V7m5 9v-8"/></svg><h2>Training hours report</h2></div><div class="actions"><button type="button" id="reload"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M20 12a8 8 0 1 0-2 5M20 7v5"/></svg><span>Muat ulang</span></button><button type="button" id="fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>Layar penuh</span></button></div></div>
     <iframe id="powerbi-report" title="Instructor Training Hours" src="https://app.powerbi.com/view?r=eyJrIjoiYTU1ZGE2ZDUtOTIyZC00MzUxLTkwNjgtMmYwZWM4MTgxOGU1IiwidCI6IjNhZDZiNTQ2LTdjMGQtNGVkNS05YTFkLWE1YmFjOTZlN2M3YSIsImMiOjEwfQ%3D%3D" allowfullscreen allow="fullscreen"></iframe>
    <output class="notice" id="notice" aria-live="polite"></output>
   </main>
  </div>

<script>
const frame = document.getElementById('powerbi-report');
const viewer = document.getElementById('report');
const notice = document.getElementById('notice');
document.getElementById('reload').addEventListener('click', () => {
  frame.src = frame.src;
  notice.textContent = 'Laporan dimuat ulang.';
});
document.getElementById('fullscreen').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (viewer.requestFullscreen) await viewer.requestFullscreen();
    else notice.textContent = 'Layar penuh tidak didukung browser ini. Gunakan tombol Buka Power BI.';
  } catch {
    notice.textContent = 'Layar penuh tidak tersedia. Gunakan tombol Buka Power BI.';
  }
});
document.addEventListener('fullscreenchange', () => {
  document.querySelector('#fullscreen span').textContent = document.fullscreenElement ? 'Keluar layar penuh' : 'Layar penuh';
});
</script>
</body>
</html>
